name: Build Flutter Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Android ഫയലുകൾ ഓട്ടോമാറ്റിക്കായി ഉണ്ടാക്കുന്നു
      - name: Generate Android Files
        run: flutter create . --platforms=android --org com.keeta.ordertracking

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keeta-Order-Tracking-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
